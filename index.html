                const actions = [{ type: 'tonify', ...result.tonify }, { type: 'sedate', ...result.sedate }];
                
                // Sort for Tangye and Yuanluo
                if (systemType !== 'zhongshi') {
                    actions.sort((a, b) => {
                        const getPart = (item) => {
                            if (!item || !item.point) return 'upper';
                            const names = item.point.split('/');
                            for(let name of names) {
                                if (POINT_LOCATIONS[name]) {
                                    const icon = POINT_LOCATIONS[name].icon;
                                    if (icon === '✋' || icon === '💪') return 'upper';
                                    if (icon === '🦵' || icon === '🦶') return 'lower';
                                }
                            }
                            return 'upper'; 
                        };
                        const partA = getPart(a);
                        const partB = getPart(b);
                        const getScore = (side, part) => {
                            if (gender === 'male') {
                                if ((side === 'left' && part === 'upper') || (side === 'right' && part === 'lower')) return 0;
                                return 1;
                            } else {
                                if ((side === 'right' && part === 'upper') || (side === 'left' && part === 'lower')) return 0;
                                return 1;
                            }
                        };
                        return getScore(a.side, partA) - getScore(b.side, partB);
                    });
                }
                return actions;
            }, [result, gender, systemType]);

            const locationHints = useMemo(() => {
                if (!result) return [];
                const points = new Set();
                const extract = (item) => {
                    if(!item || !item.point) return;
                    const names = [item.point];
                    if (item.alias) names.push(item.alias);
                    names.forEach(n => n.split('/').forEach(subName => points.add(subName)));
                };
                extract(result.tonify); extract(result.sedate);
                const hints = [];
                points.forEach(p => { if (POINT_LOCATIONS[p]) hints.push({ name: p, ...POINT_LOCATIONS[p] }); });
                return hints;
            }, [result]);

            const handleCopy = () => {
                if (!result) return;

                    `【${result.title}】 ${result.method} (${gender === 'male' ? '男' : '女'})`

                displayActions.forEach(action => {
                    const isTonify = action.type === 'tonify';
                    const sideText = action.side === 'left' ? '左' : '右';
                    const pointText = action.alias ? `${action.point}/${action.alias}` : action.point;
                    lines.push(`${isTonify ? '補' : '瀉'} ${sideText}${pointText} (${action.desc})`);
                });
                
                // Fallback copy mechanism
                const textArea = document.createElement("textarea");
                textArea.value = lines.join('\n');
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');

                    'left-chi':   { element: '命門', zs: '脈口二盛' },
                    'right-chun': { element: '心火', zs: '人迎一盛' },
                    'right-guan': { element: '肝木', zs: '人迎三盛' },
                    'right-chi':  { element: '腎水', zs: '人迎二盛' }
                };
                return isMale ? mapMale[boxId] : mapFemale[boxId];
            };

            const result = useMemo(() => {
                if (!swipeState.box || !swipeState.dir) return null;
                const mapping = getBoxElement(swipeState.box);
                const isUp = swipeState.dir === 'up';

                if (system === 'tangye') {
                    const stateLabel = isUp ? '太過' : '不足';
                    const rule = TANGYE_RULES[gender][mapping.element][stateLabel];
                    if(rule) return { title: '湯液針法 處方', method: `${mapping.element} ${stateLabel}`, ...rule };
                } else if (system === 'yuanluo') {
                    const stateLabel = isUp ? '太過' : '不足';
                    const rule = YUANLUO_RULES[gender][mapping.element][stateLabel];
                    if(rule) return { title: '原絡針法 處方', method: `${mapping.element} ${stateLabel}`, ...rule };
                } else if (system === 'zhongshi') {
                    const agitatedSuffix = isUp ? '而躁' : '';
                    let targetTreatment = '';
                    const m = mapping.zs;
                    if (m === '脈口一盛') targetTreatment = `脈口一盛${agitatedSuffix}（補${isUp?'三焦瀉心包':'膽瀉肝'}）`;
                    if (m === '脈口二盛') targetTreatment = `脈口二盛${agitatedSuffix}（補${isUp?'小腸瀉心':'膀胱瀉腎'}）`;
                    if (m === '脈口三盛') targetTreatment = `脈口三盛${agitatedSuffix}（補${isUp?'大腸瀉肺':'胃瀉脾'}）`;
                    if (m === '人迎一盛') targetTreatment = `人迎一盛${agitatedSuffix}（補${isUp?'心包瀉三焦':'肝瀉膽'}）`;
                    if (m === '人迎二盛') targetTreatment = `人迎二盛${agitatedSuffix}（補${isUp?'心瀉小腸':'腎瀉膀胱'}）`;
                    if (m === '人迎三盛') targetTreatment = `人迎三盛${agitatedSuffix}（補${isUp?'肺瀉大腸':'脾瀉胃'}）`;
                    
                    const rule = ZHONGSHI_RULES[gender][targetTreatment];
                    if(rule) return { title: '終始針法 處方', method: targetTreatment, ...rule };
                }
                return null;
            }, [gender, system, swipeState]);

            const handleDragEnd = (boxId, deltaY) => {
                if (deltaY < -20) setSwipeState({ box: boxId, dir: 'up' });
                else if (deltaY > 20) setSwipeState({ box: boxId, dir: 'down' });
            };

            const Box = ({ id, labelRight, labelLeft }) => {
                const startY = useRef(0);
                const isSelected = swipeState.box === id;
                const activeColor = gender === 'male' ? 'bg-blue-100 border-blue-400' : 'bg-pink-100 border-pink-400';
                
                let text = '';
                if (isSelected) {
                    if (system === 'zhongshi') text = swipeState.dir === 'up' ? '躁' : '無躁';
                    else text = swipeState.dir === 'up' ? '太過' : '不足';
                }

                return (
                    <div className="flex items-center w-full justify-between">
                        <div className="w-6 text-center text-sm font-bold text-slate-400">{labelLeft}</div>
                        <div 
                            className={`w-28 sm:w-36 aspect-square rounded-xl shadow-[4px_4px_10px_rgba(0,0,0,0.1)] border-2 flex items-center justify-center cursor-grab active:cursor-grabbing swipe-box transition-colors duration-200 select-none ${isSelected ? activeColor : 'bg-white border-white hover:border-slate-200'}`}
                            onPointerDown={(e) => { startY.current = e.clientY; e.target.setPointerCapture(e.pointerId); }}
                            onPointerUp={(e) => { e.target.releasePointerCapture(e.pointerId); handleDragEnd(id, e.clientY - startY.current); }}
                        >
                            {text && <span className="text-xl font-bold text-slate-500 opacity-70 pointer-events-none">{text}</span>}
                            {!text && <span className="text-xs text-slate-300 opacity-50 pointer-events-none flex flex-col items-center gap-1"><span>↑上滑</span><span>下滑↓</span></span>}
                        </div>
                        <div className="w-6 text-center text-sm font-bold text-slate-400">{labelRight}</div>
                    </div>
                );
            };

            return (
                <div className="space-y-6 pb-20">
                    <header className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500">
                        <h1 className="text-2xl font-bold flex items-center gap-2 text-indigo-900">
                            快速按鈕輔助
                        </h1>
                        <p className="text-slate-500 mt-2">滑動對應脈位，快速生成處方</p>
                    </header>

                    {/* Gender Toggle */}
                    <div className="bg-white rounded-xl shadow-sm p-2 flex relative overflow-hidden border border-slate-200">
                        <div className={`absolute top-0 bottom-0 w-1/2 transition-transform duration-300 ease-in-out ${gender === 'male' ? 'bg-blue-100 translate-x-0' : 'bg-pink-100 translate-x-full'}`}></div>
                        <button onClick={() => setSwipeState({box:null, dir:null}) || setGender('male')} className={`flex-1 py-3 font-bold z-10 transition-colors ${gender === 'male' ? 'text-blue-800' : 'text-slate-400'}`}>男性</button>
                        <button onClick={() => setSwipeState({box:null, dir:null}) || setGender('female')} className={`flex-1 py-3 font-bold z-10 transition-colors ${gender === 'female' ? 'text-pink-800' : 'text-slate-400'}`}>女性</button>
                    </div>

                    {/* System Toggle */}
                    <div className="grid grid-cols-3 gap-2">
                        <button onClick={() => setSwipeState({box:null, dir:null}) || setSystem('tangye')} className={`py-3 rounded-lg font-bold border transition-all ${system === 'tangye' ? 'bg-teal-100 text-teal-800 border-teal-300' : 'bg-white text-slate-400 border-slate-200'}`}>湯液</button>
                        <button onClick={() => setSwipeState({box:null, dir:null}) || setSystem('zhongshi')} className={`py-3 rounded-lg font-bold border transition-all ${system === 'zhongshi' ? 'bg-orange-100 text-orange-800 border-orange-300' : 'bg-white text-slate-400 border-slate-200'}`}>終始</button>
                        <button onClick={() => setSwipeState({box:null, dir:null}) || setSystem('yuanluo')} className={`py-3 rounded-lg font-bold border transition-all ${system === 'yuanluo' ? 'bg-blue-100 text-blue-800 border-blue-300' : 'bg-white text-slate-400 border-slate-200'}`}>原絡</button>
                    </div>

                    {/* Grid */}
                    <div className="bg-slate-100 rounded-xl p-6 py-8">
                        <div className="max-w-md mx-auto relative flex gap-4">
                            {/* Left Column (Right Hand) */}
                            <div className="flex-1 flex flex-col gap-6 items-end">
                                <Box id="right-chi" labelRight="" labelLeft="尺" />
                                <Box id="right-guan" labelRight="" labelLeft="關" />
                                <Box id="right-chun" labelRight="" labelLeft="寸" />
                                <div className="text-center font-bold text-slate-500 mt-2 w-28 sm:w-36">右手</div>
                            </div>
                            {/* Right Column (Left Hand) */}
                            <div className="flex-1 flex flex-col gap-6 items-start">
                                <Box id="left-chi" labelRight="尺" labelLeft="" />
                                <Box id="left-guan" labelRight="關" labelLeft="" />
                                <Box id="left-chun" labelRight="寸" labelLeft="" />
                                <div className="text-center font-bold text-slate-500 mt-2 w-28 sm:w-36">左手</div>
                            </div>
                        </div>
                    </div>

                    <ResultCard result={result} gender={gender} systemType={system} />
                </div>
            );
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('calculator'); // calculator, quick, medicine
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800">
                    {/* Navbar */}
                    <nav className="bg-indigo-900 text-white p-4 shadow-md sticky top-0 z-50 flex items-center gap-4">
                        <button onClick={() => setIsMenuOpen(true)} className="p-2 hover:bg-white/10 rounded-lg transition-colors">
                            <Icons.Menu />
                        </button>
                        <h1 className="font-bold text-lg">針灸決策輔助</h1>
                    </nav>

                    {/* Sidebar Overlay */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 transition-opacity" onClick={() => setIsMenuOpen(false)}></div>
                    )}

                    {/* Sidebar Panel */}
                    <div className={`fixed inset-y-0 left-0 w-64 bg-white shadow-2xl z-50 transform transition-transform duration-300 ease-in-out flex flex-col ${isMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 border-b flex justify-between items-center bg-indigo-50">
                            <span className="font-bold text-indigo-900">選單功能</span>
                            <button onClick={() => setIsMenuOpen(false)} className="p-2 text-indigo-900 hover:bg-indigo-100 rounded-lg"><Icons.X /></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
                            <button onClick={() => { setCurrentPage('calculator'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'calculator' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>脈法計算機</button>
                            <button onClick={() => { setCurrentPage('quick'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'quick' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>湯液/終始/原絡快速按鈕</button>
                            <button onClick={() => { setCurrentPage('medicine'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'medicine' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>藥物輔助資訊</button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="p-4 md:p-8 max-w-4xl mx-auto">
                        {currentPage === 'calculator' && <CalculatorPage />}
                        {currentPage === 'quick' && <QuickButtonPage />}
                        {currentPage === 'medicine' && <MedicineView />}
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.log('Service Worker failed', err));
            });
        }
    </script>
</body>
</html>
