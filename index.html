                                <div className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-sm font-bold" role="status">
                                    <Icons.Check />
                                    <span>{saveMessage || '已儲存'}</span>
                                </div>
                            )}
                        </div>

                        {saveStatus === 'error' && (
                            <div className="p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-medium flex items-start gap-2" role="alert">
                                <Icons.AlertTriangle className="w-4 h-4 shrink-0 mt-0.5 text-red-600" />
                                <span>{saveMessage}</span>
                            </div>
                        )}
                    </div>

                    {/* 筆記清單 */}
                    <div className="space-y-3">
                        <div className="flex items-center justify-between px-1">
                            <h3 className="font-bold text-slate-700 text-base">已保存的筆記（{notes.length}）</h3>
                            <span className="text-xs text-slate-400">依最後更新時間由新到舊排序</span>
                        </div>

                        {isLoading && (
                            <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center text-slate-500 text-sm">
                                載入筆記中...
                            </div>
                        )}

                        {!isLoading && !corrupted && loadError && (
                            <div className="bg-red-50 rounded-2xl border border-red-200 p-5 text-red-800 text-sm space-y-3" role="alert">
                                <div className="font-bold">無法讀取筆記</div>
                                <p>{loadError}</p>
                                <button
                                    type="button"
                                    onClick={loadNotes}
                                    className="px-4 py-1.5 rounded-lg bg-white border border-red-300 text-red-700 font-bold hover:bg-red-100"
                                >
                                    重新載入
                                </button>
                            </div>
                        )}

                        {!isLoading && !corrupted && !loadError && notes.length === 0 && (
                            <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center space-y-1.5">
                                <div className="text-slate-600 font-bold">目前尚無私人筆記</div>
                                <p className="text-xs sm:text-sm text-slate-400">在上方輸入內容並點擊「儲存筆記」，即可保存在目前瀏覽器中。</p>
                            </div>
                        )}

                        {!isLoading && !corrupted && notes.map((note) => (
                            <article
                                key={note.id}
                                className={`bg-white rounded-2xl shadow-sm border p-4 sm:p-5 space-y-3 transition-colors ${
                                    editingId === note.id ? 'border-indigo-400 ring-2 ring-indigo-100' : 'border-slate-200'
                                }`}
                            >
                                <div className="note-content text-slate-800 text-sm sm:text-base leading-relaxed break-words">
                                    {notesApi ? renderNoteAstToReact(notesApi.parseSafeNoteToAst(note.content), note.id) : note.content}
                                </div>
                                <div className="pt-2.5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400">
                                    <div className="space-x-2">
                                        <span>更新：{formatNoteTimestamp(note.updatedAt)}</span>
                                        {note.createdAt !== note.updatedAt && (
                                            <span className="hidden sm:inline">｜建立：{formatNoteTimestamp(note.createdAt)}</span>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button
                                            type="button"
                                            onClick={() => handleStartEdit(note)}
                                            className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold transition-colors"
                                        >
                                            <Icons.Edit className="w-3.5 h-3.5" />
                                            <span>編輯</span>
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setDeleteTarget(note)}
                                            className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-red-50 hover:bg-red-100 text-red-600 font-bold transition-colors"
                                        >
                                            <Icons.Trash className="w-3.5 h-3.5" />
                                            <span>刪除</span>
                                        </button>
                                    </div>
                                </div>
                            </article>
                        ))}
                    </div>

                    {/* 刪除二次確認視窗 */}
                    {deleteTarget && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="delete-note-title">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 sm:p-6 space-y-4">
                                <div className="flex items-start gap-3">
                                    <div className="p-2 bg-red-100 text-red-600 rounded-xl shrink-0">
                                        <Icons.Trash className="w-5 h-5" />
                                    </div>
                                    <div className="space-y-1">
                                        <h4 id="delete-note-title" className="font-bold text-lg text-slate-900">確認刪除此則筆記？</h4>
                                        <p className="text-sm text-slate-600">刪除後將立即從本機移除，無法復原。</p>
                                    </div>
                                </div>
                                <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-600 max-h-24 overflow-y-auto break-words">
                                    {notesApi ? notesApi.extractPlainText(deleteTarget.content).slice(0, 120) : ''}
                                </div>
                                <div className="flex justify-end gap-2 pt-1">
                                    <button
                                        type="button"
                                        disabled={isDeleting}
                                        onClick={() => setDeleteTarget(null)}
                                        className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition-colors"
                                    >
                                        取消
                                    </button>
                                    <button
                                        type="button"
                                        disabled={isDeleting}
                                        onClick={handleConfirmDelete}
                                        className="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm disabled:opacity-50 transition-colors"
                                    >
                                        {isDeleting ? '刪除中...' : '確認刪除'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 受損資料重設二次確認視窗 */}
                    {resetConfirmOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="reset-corrupt-title">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 sm:p-6 space-y-4">
                                <div className="flex items-start gap-3">
                                    <div className="p-2 bg-red-100 text-red-600 rounded-xl shrink-0">
                                        <Icons.AlertTriangle className="w-5 h-5" />
                                    </div>
                                    <div className="space-y-1.5">
                                        <h4 id="reset-corrupt-title" className="font-bold text-lg text-slate-900">確認清除受損的筆記資料？</h4>
                                        <p className="text-sm text-slate-600 leading-relaxed">
                                            此操作會<strong>永久刪除</strong>目前受損的本機筆記資料並恢復空白狀態，刪除後無法復原。
                                        </p>
                                        <p className="text-xs text-slate-500">
                                            若想先手動保留原始文字，請點擊「取消」，並至瀏覽器開發者工具檢查 localStorage（key：<code className="bg-slate-100 px-1 rounded">{notesApi ? notesApi.STORAGE_KEY : 'acu_bot2.private_notes.v1'}</code>）。
                                        </p>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-2 pt-1">
                                    <button
                                        type="button"
                                        disabled={isResetting}
                                        onClick={() => setResetConfirmOpen(false)}
                                        className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm transition-colors"
                                    >
                                        取消（保留資料）
                                    </button>
                                    <button
                                        type="button"
                                        disabled={isResetting}
                                        onClick={handleConfirmResetCorrupted}
                                        className="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm disabled:opacity-50 transition-colors"
                                    >
                                        {isResetting ? '重設中...' : '確認刪除並重設'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [currentPage, setCurrentPage] = useState('calculator'); // calculator, quick, pan_medicine, xiao_medicine, linggui_bafa, gallery, private_notes
            const [isMenuOpen, setIsMenuOpen] = useState(false);

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-800">
                    {/* Navbar */}
                    <nav className="bg-indigo-900 text-white p-4 shadow-md sticky top-0 z-50 flex items-center gap-4">
                        <button onClick={() => setIsMenuOpen(true)} className="p-2 hover:bg-white/10 rounded-lg transition-colors">
                            <Icons.Menu />
                        </button>
                        <h1 className="font-bold text-lg">針灸決策輔助</h1>
                    </nav>

                    {/* Sidebar Overlay */}
                    {isMenuOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 transition-opacity" onClick={() => setIsMenuOpen(false)}></div>
                    )}

                    {/* Sidebar Panel */}
                    <div className={`fixed inset-y-0 left-0 w-64 bg-white shadow-2xl z-50 transform transition-transform duration-300 ease-in-out flex flex-col ${isMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 border-b flex justify-between items-center bg-indigo-50">
                            <span className="font-bold text-indigo-900">選單功能</span>
                            <button onClick={() => setIsMenuOpen(false)} className="p-2 text-indigo-900 hover:bg-indigo-100 rounded-lg"><Icons.X /></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 flex flex-col gap-2">
                            <button onClick={() => { setCurrentPage('calculator'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'calculator' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>脈法計算機</button>
                            <button onClick={() => { setCurrentPage('quick'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'quick' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>湯液/終始/原絡快速按鈕</button>
                            <button onClick={() => { setCurrentPage('pan_medicine'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'pan_medicine' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>潘老師用藥策略</button>
                            <button onClick={() => { setCurrentPage('xiao_medicine'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'xiao_medicine' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>蕭醫師用藥策略</button>
                            <button onClick={() => { setCurrentPage('linggui_bafa'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'linggui_bafa' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>靈龜八法穴組參考</button>
                            <button onClick={() => { setCurrentPage('gallery'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'gallery' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>穴位圖一覽</button>
                            <button onClick={() => { setCurrentPage('private_notes'); setIsMenuOpen(false); }} className={`p-4 rounded-xl text-left font-bold transition-colors ${currentPage === 'private_notes' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-100'}`}>私人筆記</button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <main className="p-4 md:p-8 max-w-4xl mx-auto">
                        {currentPage === 'calculator' && <CalculatorPage />}
                        {currentPage === 'quick' && <QuickButtonPage />}
                        {(currentPage === 'pan_medicine' || currentPage === 'medicine') && (
                            <PentagonMedicineView 
                                title="潘老師用藥策略" 
                                subtitle="五大用藥系統：湯液藥精、溫升涼降、涼升溫降、終始藥方系統" 
                                systems={PAN_MEDICINE_SYSTEMS} 
                            />
                        )}
                        {currentPage === 'xiao_medicine' && (
                            <PentagonMedicineView 
                                title="蕭醫師用藥策略" 
                                subtitle="終始藥方系統：人迎與脈口各盛衰精準用藥及劑量" 
                                systems={XIAO_MEDICINE_SYSTEMS} 
                            />
                        )}
                        {currentPage === 'linggui_bafa' && <LingguiBafaView />}
                        {currentPage === 'gallery' && <AcupointGalleryView />}
                        {currentPage === 'private_notes' && <PrivateNotesView />}
                    </main>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.log('Service Worker failed', err));
            });
        }
    </script>
</body>
</html>
