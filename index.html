            if (leftDir === 'up-left' || rightDir === 'down-left') addPoint('後溪');
            if (rightDir === 'left' || leftDir === 'left') addPoint('足臨泣');
            if (rightDir === 'up-right' || leftDir === 'up-right') addPoint('申脈');
            if (rightDir === 'down-right' || leftDir === 'down-right') addPoint('照海');
            if (rightDir === 'up' && leftDir === 'up') addPoint('外關');
            if (rightDir === 'down' && leftDir === 'down') addPoint('內關');

            if (matchedPoints.length === 0) {
                return {
                    status: 'unmatched',
                    message: '脈象不完全符合奇經八脈',
                    points: []
                };
            }

            let yinAction = null;
            let yinType = 'tonify';
            if (zhongshiResult) {
                const isMaikou = zhongshiResult.method && zhongshiResult.method.includes('脈口');
                yinAction = isMaikou ? zhongshiResult.sedate : zhongshiResult.tonify;
                yinType = isMaikou ? 'sedate' : 'tonify';
            }

            const points = matchedPoints.map((pt) => {
                if (!yinAction) {
                    return { point: pt, side: null, desc: '遠心、順轉（請先選擇上方寸關尺脈位以決定左右側）', type: yinType };
                }
                const isOpposite = OPPOSITE_SIDE_EXTRA_POINTS.has(pt);
                const side = isOpposite ? (yinAction.side === 'left' ? 'right' : 'left') : yinAction.side;
                return {
                    point: pt,
                    side,
                    desc: yinAction.desc,
                    type: yinType
                };
            });

            return {
                status: matchedPoints.length >= 2 ? 'multiple' : 'single',
                note: matchedPoints.length >= 2 ? '脈象同時符合兩條奇經八脈，請斟酌參考' : null,
                points
            };
        };

        const ResultCard = ({ result, gender, systemType, extraResult = null }) => {
            const [copied, setCopied] = useState(false);
            const [viewMode, setViewMode] = useState('acupuncture'); // 'acupuncture' | 'medicine'
            const [medStrategy, setMedStrategy] = useState('pan'); // 'pan' | 'xiao'

            const displayActions = useMemo(() => {
                if (!result) return [];
                const actions = [{ type: 'tonify', ...result.tonify }, { type: 'sedate', ...result.sedate }];
                
                // Sort for Tangye and Yuanluo
                if (systemType !== 'zhongshi') {
                    actions.sort((a, b) => {
                        const partA = getPointPart(a);
                        const partB = getPointPart(b);
                        return getPartScore(gender, a.side, partA) - getPartScore(gender, b.side, partB);
                    });
                }
                return actions;
            }, [result, gender, systemType]);

            const locationHints = useMemo(() => {
                const points = new Set();
                const extract = (item) => {
                    if(!item || !item.point) return;
                    const names = [item.point];
                    if (item.alias) names.push(item.alias);
                    names.forEach(n => n.split('/').forEach(subName => points.add(subName)));
                };
                if (result) {
                    extract(result.tonify); extract(result.sedate);
                }
                if (systemType === 'zhongshi' && extraResult && extraResult.points) {
                    extraResult.points.forEach(pt => extract(pt));
                }
                const hints = [];
                points.forEach(p => { if (POINT_LOCATIONS[p]) hints.push({ name: p, ...POINT_LOCATIONS[p] }); });
                return hints;
            }, [result, extraResult, systemType]);

            const handleCopy = async () => {
                if (!result && !extraResult) return;
                const lines = [];
                if (result) {
                    lines.push(`【${result.title}】 ${result.method} (${gender === 'male' ? '男' : '女'})`);
                    displayActions.forEach(action => {
                        const isTonify = action.type === 'tonify';
                        const sideText = action.side === 'left' ? '左' : '右';
                        const pointText = action.alias ? `${action.point}/${action.alias}` : action.point;
                        lines.push(`${isTonify ? '補' : '瀉'} ${sideText}${pointText} (${action.desc})`);
                    });
                }
                if (systemType === 'zhongshi' && extraResult) {
                    if (extraResult.status === 'unmatched') {
                        lines.push(`【奇經八脈】 ${extraResult.message}`);
                    } else if (extraResult.points) {
                        extraResult.points.forEach(pt => {
                            const sideText = pt.side ? (pt.side === 'left' ? '左' : '右') : '';
                            lines.push(`奇經八脈 ${sideText}${pt.point} (${pt.desc})`);
                        });
                        if (extraResult.note) lines.push(`註：${extraResult.note}`);
                    }
                }
                
                const copyText = lines.join('\n');
                let success = false;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    try {
                        await navigator.clipboard.writeText(copyText);
                        success = true;
                    } catch (err) {
                        success = false;
                    }
                }
                if (!success) {
                    const textArea = document.createElement("textarea");
                    textArea.value = copyText;
                    textArea.style.position = 'fixed';
                    textArea.style.opacity = '0';
                    document.body.appendChild(textArea);
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        success = true;
                    } catch (err) {
                        console.error('Failed to copy', err);
                    }
                    document.body.removeChild(textArea);
                }
                if (success) {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            const medicineElement = useMemo(() => {
                if (!result) return null;
                if (systemType === 'tangye' || systemType === 'yuanluo') {
                    return result.method.split(' ')[0]; // e.g., "心火"
                } else if (systemType === 'zhongshi') {
                    if (result.method.includes('一盛而躁')) return '命門';
                    if (result.method.includes('二盛而躁')) return '心火';
                    if (result.method.includes('三盛而躁')) return '肺金';
                    if (result.method.includes('一盛')) return '肝木';
                    if (result.method.includes('二盛')) return '腎水';
                    if (result.method.includes('三盛')) return '脾土';
                }
                return null;
            }, [result, systemType]);

            const displayMedicineSystems = useMemo(() => {
                if (!result) return [];
                let systems = [...PAN_MEDICINE_SYSTEMS];
                
                if (systemType === 'zhongshi') {
                    const isRenying = result.method.includes('人迎');
                    const targetZhongshiId = isRenying ? 'zhongshi_renying' : 'zhongshi_maikou';
                    
                    const targetSys = systems.find(s => s.id === targetZhongshiId);
                    const otherSys = systems.filter(s => !s.id.startsWith('zhongshi_'));
                    
                    return [targetSys, ...otherSys];
                } else {
                    return systems.filter(s => !s.id.startsWith('zhongshi_'));
                }
            }, [result, systemType]);

            const displayXiaoMedicineSystems = useMemo(() => {
                if (!result) return [];
                let systems = [...XIAO_MEDICINE_SYSTEMS];
                if (systemType === 'zhongshi') {
                    const isRenying = result.method.includes('人迎');
                    const targetId = isRenying ? 'xiao_zhongshi_renying' : 'xiao_zhongshi_maikou';
                    const targetSys = systems.find(s => s.id === targetId);
                    const otherSys = systems.filter(s => s.id !== targetId);
                    return [targetSys, ...otherSys];
                }
                return systems;
            }, [result, systemType]);

            if (!result && !(systemType === 'zhongshi' && extraResult)) return null;

            return (
                <div className="mt-6 animate-in slide-in-from-bottom-8 duration-700">
                    <div className="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden">
                        <div className="bg-indigo-900 text-white p-4">
                            <div className="flex justify-between items-center">
                                <h4 className="text-lg font-bold">{result ? result.method : '奇經八脈辨脈'}</h4>
                                <span className="bg-white/20 px-3 py-1 rounded-full text-sm">{result ? result.title : '終始針法 處方'}</span>
                            </div>
                        </div>
                        
                        {viewMode === 'acupuncture' || !result ? (
                            <div className="p-6">
                                {result && (
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                                        {displayActions.map((action, idx) => {
                                            const isTonify = action.type === 'tonify';
                                            return (
                                                <div key={idx} className={`${isTonify ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'} border-l-4 p-4 rounded-r-lg`}>
                                                    <h5 className={`font-bold ${isTonify ? 'text-green-800' : 'text-red-800'} flex items-center gap-2 mb-2`}>
                                                        {isTonify ? <Icons.ArrowRight className="w-5 h-5" /> : <Icons.RotateCcw className="w-5 h-5" />}
                                                        {isTonify ? '補法 (Tonify)' : '瀉法 (Sedate)'}
                                                    </h5>
                                                    <div className="text-lg font-bold mb-1">
                                                        {action.side === 'left' ? '左' : '右'}
                                                        {action.alias ? `${action.point}/${action.alias}` : action.point}
                                                    </div>
                                                    <p className={`${isTonify ? 'text-green-700' : 'text-red-700'} text-sm leading-relaxed`}>{action.desc}</p>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {systemType === 'zhongshi' && extraResult && (
                                    <div className="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-lg mb-6 animate-in fade-in">
                                        <h5 className="font-bold text-amber-800 flex items-center gap-2 mb-2">
                                            ✨ 奇經八脈額外選穴
                                        </h5>
                                        {extraResult.status === 'unmatched' ? (
                                            <p className="text-amber-800 font-bold text-base">{extraResult.message}</p>
                                        ) : (
                                            <div className="space-y-3">
                                                {extraResult.points.map((pt, i) => (
                                                    <div key={i} className="border-b border-amber-200/60 last:border-b-0 pb-2 last:pb-0">
                                                        <div className="text-lg font-bold text-amber-900 mb-0.5 flex items-center gap-2">
                                                            <span>
                                                                {pt.side ? (pt.side === 'left' ? '左' : '右') : ''}
                                                                {pt.point}
                                                            </span>
                                                            <span className="text-xs font-semibold px-2 py-0.5 rounded bg-amber-200/70 text-amber-900">
                                                                {pt.type === 'sedate' ? '陰經瀉法手法' : '陰經補法手法'}
                                                            </span>
                                                        </div>
                                                        <p className="text-amber-800 text-sm leading-relaxed">{pt.desc}</p>
                                                    </div>
                                                ))}
                                                {extraResult.note && (
                                                    <p className="text-xs font-bold text-amber-800 bg-amber-100/90 px-3 py-2 rounded-lg border border-amber-200">
                                                        ⚠️ {extraResult.note}
                                                    </p>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                )}
                                
                                {/* 複製與切換按鈕區塊 */}
                                <div className="flex gap-3 mb-6">
                                    <button 
                                        onClick={handleCopy}
                                        className={`flex-1 py-3 px-4 rounded-lg flex items-center justify-center gap-2 font-bold transition-all ${copied ? 'bg-green-100 text-green-700 border-2 border-green-500' : 'bg-purple-100 text-purple-700 border-2 border-purple-200 hover:border-purple-300'}`}
                                    >
                                        {copied ? <Icons.Check /> : <Icons.Copy />}
                                        {copied ? '已複製到剪貼簿！' : '一鍵複製解答'}
                                    </button>
                                    <button 
                                        onClick={() => setViewMode('medicine')}
                                        className="flex-1 py-3 px-4 rounded-lg bg-indigo-100 text-indigo-700 border-2 border-indigo-200 hover:border-indigo-300 font-bold flex items-center justify-center gap-2 transition-all"
                                    >
                                        <Icons.Pill /> 顯示用藥策略
                                    </button>
                                </div>

                                {systemType === 'tangye' && (
                                    <div className="bg-slate-100/60 border border-slate-200 rounded-xl p-5 mb-6">
                                        <p className="text-sm text-slate-500 leading-relaxed pl-6 -indent-6 mb-2">
                                             進針：輕咳進針，在天地人三部，各針三次，共九次。過程配合病人以口呼吸：吸氣進針，吐氣停止。
                                        </p>
                                        <p className="text-sm text-slate-500 leading-relaxed pl-6 -indent-6">
                                             行針：針上肢時，病人以鼻呼吸；針下肢時，病人以口呼吸。<br/>
                                            針尖向心方向，配合吐氣動針，吸氣停止；針尖遠心方向，配合吸氣動針，吐氣停止。
                                        </p>
                                    </div>
                                )}

                                <div className="bg-slate-100 rounded-xl p-6 mb-6">
                                    <h5 className="flex items-center gap-2 text-slate-700 font-bold mb-4 border-b border-slate-200 pb-2"><Icons.MapPin className="w-5 h-5" /> 穴位定位提示</h5>
                                    <div className="grid grid-cols-1 gap-4">
                                        {locationHints.map((hint, idx) => (
                                            <div key={idx} className="flex gap-3 items-start">
                                                <span className="text-2xl bg-white w-10 h-10 flex items-center justify-center rounded-lg shadow-sm border border-slate-200 shrink-0">{hint.icon}</span>
                                                <div>
                                                    <span className="font-bold text-slate-900 block mb-1">{hint.name}</span>
                                                    <span className="text-slate-600 text-sm leading-relaxed">{hint.text}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* 圖片區塊 */}
                                <div className="space-y-4">
                                    {locationHints.some(h => h.icon === '✋' || h.icon === '💪') && (
                                        <>
                                            <img src="hand1.jpg" alt="Hand 1" className="w-full rounded-xl shadow-sm" onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }} />
                                            <div className="hidden w-full h-32 bg-slate-200 rounded-xl flex items-center justify-center text-slate-400 font-medium">hand1.jpg 預留區</div>
                                            
                                            <img src="hand2.jpg" alt="Hand 2" className="w-full rounded-xl shadow-sm" onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }} />
                                            <div className="hidden w-full h-32 bg-slate-200 rounded-xl flex items-center justify-center text-slate-400 font-medium">hand2.jpg 預留區</div>
                                            
                                            <img src="hand3.jpg" alt="Hand 3" className="w-full rounded-xl shadow-sm" onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }} />
                                            <div className="hidden w-full h-32 bg-slate-200 rounded-xl flex items-center justify-center text-slate-400 font-medium">hand3.jpg 預留區</div>
                                        </>
                                    )}
                                    {locationHints.some(h => h.icon === '🦵' || h.icon === '🦶') && (
                                        <>
                                            <img src="foot1.jpg" alt="Foot 1" className="w-full rounded-xl shadow-sm" onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }} />
                                            <div className="hidden w-full h-32 bg-slate-200 rounded-xl flex items-center justify-center text-slate-400 font-medium">foot1.jpg 預留區</div>
                                            
                                            <img src="foot2.jpg" alt="Foot 2" className="w-full rounded-xl shadow-sm" onError={(e) => { e.target.style.display = 'none'; e.target.nextElementSibling.style.display = 'flex'; }} />
                                            <div className="hidden w-full h-32 bg-slate-200 rounded-xl flex items-center justify-center text-slate-400 font-medium">foot2.jpg 預留區</div>
                                        </>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="p-6 animate-in fade-in">
                                <div className="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b pb-4">
                                    <h5 className="font-bold text-slate-800 text-lg flex items-center gap-2">
                                        <Icons.Pill /> 用藥策略組合 ({medicineElement})
                                    </h5>
                                    <button 
                                        onClick={() => setViewMode('acupuncture')}
                                        className="py-2 px-4 rounded-lg bg-indigo-50 text-indigo-600 border border-indigo-200 hover:bg-indigo-100 font-bold transition-all text-sm self-start sm:self-auto"
                                    >
                                        返回針灸處方
                                    </button>
                                </div>

                                {/* 醫師策略切換 Tab */}
                                <div className="flex gap-2 mb-6 bg-slate-100 p-1.5 rounded-xl">
                                    <button 
                                        onClick={() => setMedStrategy('pan')}
                                        className={`flex-1 py-2.5 px-3 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-1.5 ${medStrategy === 'pan' ? 'bg-white text-indigo-700 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        🧑‍🏫 潘老師用藥策略
                                    </button>
                                    <button 
                                        onClick={() => setMedStrategy('xiao')}
                                        className={`flex-1 py-2.5 px-3 rounded-lg font-bold text-sm transition-all flex items-center justify-center gap-1.5 ${medStrategy === 'xiao' ? 'bg-white text-indigo-700 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        👨‍⚕️ 蕭醫師用藥策略
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {(medStrategy === 'pan' ? displayMedicineSystems : displayXiaoMedicineSystems).map(sys => {
                                        const elementData = sys.data[medicineElement];
                                        if (!elementData) return null;
                                        return (
                                            <div key={sys.id} className="bg-slate-50 border border-slate-200 p-4 rounded-lg">
                                                <div className="font-bold text-slate-700 mb-3 flex items-center gap-2">
                                                    <span className="text-xl">{sys.icon}</span> {sys.title}
                                                </div>
                                                {sys.type === 'list' ? (
                                                    <div className="bg-white p-3 rounded shadow-sm border border-slate-100 flex flex-col items-center gap-2">
                                                        <div className={`px-3 py-1 rounded text-sm font-bold border ${elementData.color}`}>
                                                            {elementData.state}
                                                        </div>
                                                        <div className="flex flex-wrap justify-center gap-3 sm:gap-6 mt-1">
                                                            {elementData.list.map((med, i) => (
                                                                <span key={i} className="font-bold text-slate-800 text-sm sm:text-base">{med}</span>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="flex gap-4">
                                                        <div className="flex-1 bg-white p-3 rounded shadow-sm border border-slate-100 text-center">
                                                            <div className="text-xs text-slate-400 mb-1">{sys.leftAction}</div>
                                                            <div className="font-bold text-slate-800">{elementData.left}</div>
                                                        </div>
                                                        <div className="flex-1 bg-white p-3 rounded shadow-sm border border-slate-100 text-center">
                                                            <div className="text-xs text-slate-400 mb-1">{sys.rightAction}</div>
                                                            <div className="font-bold text-slate-800">{elementData.right}</div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const CalculatorPage = () => {
          const [gender, setGender] = useState('male');
          const [systemType, setSystemType] = useState(null); // 'tangye', 'zhongshi', 'yuanluo'
          const [tangyePulse, setTangyePulse] = useState(null);
          const [tangyeState, setTangyeState] = useState(null);
          const [zhongshiPulsePos, setZhongshiPulsePos] = useState(null);
          const [isAgitated, setIsAgitated] = useState(null);
          const [zhongshiTreatment, setZhongshiTreatment] = useState(null);

          const handleSystemChange = (val) => {
            setSystemType(val);
            setTangyePulse(null); setTangyeState(null);
            setZhongshiPulsePos(null); setIsAgitated(null); setZhongshiTreatment(null);
          };

          const handlePulsePosChange = (val) => { setZhongshiPulsePos(val); setZhongshiTreatment(null); };
          const handleAgitatedChange = (val) => { setIsAgitated(val); setZhongshiTreatment(null); };

          const zhongshiOptions = useMemo(() => {
            if (!zhongshiPulsePos || isAgitated === null) return [];
            if (zhongshiPulsePos === '人迎') {
              return isAgitated === 'no' 
                ? ['人迎一盛（補肝瀉膽）', '人迎二盛（補腎瀉膀胱）', '人迎三盛（補脾瀉胃）']
                : ['人迎一盛而躁（補心包瀉三焦）', '人迎二盛而躁（補心瀉小腸）', '人迎三盛而躁（補肺瀉大腸）'];
            } else {
              return isAgitated === 'no'
                ? ['脈口一盛（補膽瀉肝）', '脈口二盛（補膀胱瀉腎）', '脈口三盛（補胃瀉脾）']
                : ['脈口一盛而躁（補三焦瀉心包）', '脈口二盛而躁（補小腸瀉心）', '脈口三盛而躁（補大腸瀉肺）'];
            }
          }, [zhongshiPulsePos, isAgitated]);

          const result = useMemo(() => {
            let res = null;
            if (systemType === 'tangye' && tangyePulse && tangyeState) {
              const rule = TANGYE_RULES[gender][tangyePulse][tangyeState];
              if (rule) res = { title: '湯液針法 處方', method: `${tangyePulse} ${tangyeState}`, tonify: rule.tonify, sedate: rule.sedate };
            } else if (systemType === 'zhongshi' && zhongshiTreatment) {
               const rule = ZHONGSHI_RULES[gender][zhongshiTreatment];
               if (rule) res = { title: '終始針法 處方', method: zhongshiTreatment, tonify: rule.tonify, sedate: rule.sedate };
            } else if (systemType === 'yuanluo' && tangyePulse && tangyeState) {
                const rule = YUANLUO_RULES[gender][tangyePulse][tangyeState];
                if (rule) res = { title: '原絡針法 處方', method: `${tangyePulse} ${tangyeState}`, tonify: rule.tonify, sedate: rule.sedate };
            }
            return res;
          }, [gender, systemType, tangyePulse, tangyeState, zhongshiTreatment]);

          return (
            <div className="space-y-6 pb-20">
                <header className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500">
                  <h1 className="text-2xl font-bold flex items-center gap-2 text-indigo-900">
                    <Icons.Activity /> 脈法計算機
                  </h1>
                  <p className="text-slate-500 mt-2">Janna珍娜-湯液針法/終始針法/原絡針法 整合學習系統</p>
                  <p className="text-slate-400 text-sm mt-1 text-right">劉可炫、小奈共同製作</p>
                </header>

                <section className="bg-white p-6 rounded-xl shadow-sm animate-in fade-in slide-in-from-bottom-4 duration-500">
                  <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">病人性別</h2>
                  <div className="flex gap-4">
                    <button onClick={() => setGender('male')} className={`flex-1 py-3 px-4 rounded-lg border-2 transition-all flex items-center justify-center gap-2 ${gender === 'male' ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold' : 'border-slate-200 hover:border-slate-300'}`}><Icons.User /> 男</button>
                    <button onClick={() => setGender('female')} className={`flex-1 py-3 px-4 rounded-lg border-2 transition-all flex items-center justify-center gap-2 ${gender === 'female' ? 'border-pink-500 bg-pink-50 text-pink-700 font-bold' : 'border-slate-200 hover:border-slate-300'}`}><Icons.User /> 女</button>
                  </div>
                </section>

                <section className="bg-white p-6 rounded-xl shadow-sm animate-in fade-in slide-in-from-bottom-4 duration-500 delay-100">
                  <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">針法系統</h2>
                  <div className="flex flex-col gap-3">
                    <button onClick={() => handleSystemChange('tangye')} className={`py-3 px-4 rounded-lg border-2 transition-all ${systemType === 'tangye' ? 'border-teal-500 bg-teal-50 text-teal-700 font-bold' : 'border-slate-200 hover:border-slate-300'}`}>獨異 (湯液針法)</button>
                    <button onClick={() => handleSystemChange('zhongshi')} className={`py-3 px-4 rounded-lg border-2 transition-all ${systemType === 'zhongshi' ? 'border-orange-500 bg-orange-50 text-orange-700 font-bold' : 'border-slate-200 hover:border-slate-300'}`}>陰陽不平衡 (終始針法)</button>
                    <button onClick={() => handleSystemChange('yuanluo')} className={`py-3 px-4 rounded-lg border-2 transition-all ${systemType === 'yuanluo' ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold' : 'border-slate-200 hover:border-slate-300'}`}>原絡針法</button>
                  </div>
                </section>

                {(systemType === 'tangye' || systemType === 'yuanluo') && (
                  <div className="space-y-6 animate-in zoom-in-95 duration-300">
                    <section className="bg-white p-6 rounded-xl shadow-sm">
                      <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">哪個脈位獨異？</h2>
                      <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                        {['心火', '肝木', '腎水', '肺金', '脾土', '命門'].map(p => (
                          <button key={p} onClick={() => setTangyePulse(p)} className={`py-2 px-3 rounded-lg border transition-all ${tangyePulse === p ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>{p}</button>
                        ))}
                      </div>
                    </section>
                    {tangyePulse && (
                      <section className="bg-white p-6 rounded-xl shadow-sm animate-in fade-in slide-in-from-bottom-2">
                        <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">該脈位狀態？</h2>
                        <div className="flex gap-4">
                          <button onClick={() => setTangyeState('太過')} className={`flex-1 py-3 rounded-lg border-2 transition-all flex items-center justify-center gap-2 ${tangyeState === '太過' ? 'border-red-500 bg-red-50 text-red-700 font-bold' : 'border-slate-200'}`}><Icons.ArrowRight className="w-4 h-4 -rotate-45" /> 太過</button>
                          <button onClick={() => setTangyeState('不足')} className={`flex-1 py-3 rounded-lg border-2 transition-all flex items-center justify-center gap-2 ${tangyeState === '不足' ? 'border-blue-500 bg-blue-50 text-blue-700 font-bold' : 'border-slate-200'}`}><Icons.ArrowRight className="w-4 h-4 rotate-45" /> 不足</button>
                        </div>
                      </section>
                    )}
                  </div>
                )}

                {systemType === 'zhongshi' && (
                  <div className="space-y-6 animate-in zoom-in-95 duration-300">
                    <section className="bg-white p-6 rounded-xl shadow-sm">
                      <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">脈位狀態？</h2>
                      <div className="flex gap-4">
                        {['人迎', '脈口'].map(opt => (
                          <button key={opt} onClick={() => handlePulsePosChange(opt)} className={`flex-1 py-3 rounded-lg border-2 transition-all ${zhongshiPulsePos === opt ? 'border-purple-500 bg-purple-50 text-purple-700 font-bold' : 'border-slate-200'}`}>{opt}</button>
                        ))}
                      </div>
                    </section>
                    {zhongshiPulsePos && (
                      <section className="bg-white p-6 rounded-xl shadow-sm animate-in fade-in slide-in-from-bottom-2">
                        <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">是否為躁？</h2>
                        <div className="flex gap-4">
                           <button onClick={() => handleAgitatedChange('yes')} className={`flex-1 py-3 rounded-lg border-2 transition-all ${isAgitated === 'yes' ? 'border-red-500 bg-red-50 text-red-700 font-bold' : 'border-slate-200'}`}>是</button>
                           <button onClick={() => handleAgitatedChange('no')} className={`flex-1 py-3 rounded-lg border-2 transition-all ${isAgitated === 'no' ? 'border-green-500 bg-green-50 text-green-700 font-bold' : 'border-slate-200'}`}>否</button>
                        </div>
                      </section>
                    )}
                    {zhongshiPulsePos && isAgitated && (
                      <section className="bg-white p-6 rounded-xl shadow-sm animate-in fade-in slide-in-from-bottom-2">
                        <h2 className="text-lg font-semibold mb-4 flex items-center gap-2">治療原則</h2>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                          {zhongshiOptions.map(opt => (
                            <button key={opt} onClick={() => setZhongshiTreatment(opt)} className={`p-4 rounded-lg border text-left transition-all ${zhongshiTreatment === opt ? 'bg-indigo-600 text-white border-indigo-600 shadow-md' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>{opt}</button>
                          ))}
                        </div>
                      </section>
                    )}
                  </div>
                )}

                <ResultCard result={result} gender={gender} systemType={systemType} />
            </div>
          );
        };

        const MAP_MALE = {
            'right-chun': { element: '肺金', zs: '脈口一盛' },
            'right-guan': { element: '脾土', zs: '脈口三盛' },
            'right-chi':  { element: '命門', zs: '脈口二盛' },
            'left-chun':  { element: '心火', zs: '人迎一盛' },
            'left-guan':  { element: '肝木', zs: '人迎三盛' },
            'left-chi':   { element: '腎水', zs: '人迎二盛' }
        };
        const MAP_FEMALE = {
            'left-chun':  { element: '肺金', zs: '脈口一盛' },
            'left-guan':  { element: '脾土', zs: '脈口三盛' },
            'left-chi':   { element: '命門', zs: '脈口二盛' },
            'right-chun': { element: '心火', zs: '人迎一盛' },
            'right-guan': { element: '肝木', zs: '人迎三盛' },
            'right-chi':  { element: '腎水', zs: '人迎二盛' }
        };

        const getOctagonDirectionFromDelta = (dx, dy) => {
            const deg = Math.atan2(dy, dx) * (180 / Math.PI);
            if (deg >= -112.5 && deg < -67.5) return 'up';
            if (deg >= -67.5 && deg < -22.5) return 'up-right';
            if (deg >= -22.5 && deg < 22.5) return 'right';
            if (deg >= 22.5 && deg < 67.5) return 'down-right';
            if (deg >= 67.5 && deg < 112.5) return 'down';
            if (deg >= 112.5 && deg < 157.5) return 'down-left';
            if (deg >= -157.5 && deg < -112.5) return 'up-left';
            return 'left';
        };

        const QuickButtonPage = () => {
            const [gender, setGender] = useState('male');
            const [system, setSystem] = useState('tangye'); // tangye, zhongshi, yuanluo
            const [swipeState, setSwipeState] = useState({ box: null, dir: null });
            const [extraState, setExtraState] = useState({ right: null, left: null });
            const [activeMenu, setActiveMenu] = useState(null);

            // Maps physical box to Element/Zhongshi label based on Gender
            const getBoxElement = (boxId) => {
                return (gender === 'male' ? MAP_MALE : MAP_FEMALE)[boxId];
            };

            const result = useMemo(() => {
                if (!swipeState.box || !swipeState.dir) return null;
                const mapping = getBoxElement(swipeState.box);
                if (!mapping) return null;
                const isUp = swipeState.dir === 'up';

                if (system === 'tangye') {
                    const stateLabel = isUp ? '太過' : '不足';
                    const rule = TANGYE_RULES[gender][mapping.element][stateLabel];
                    if(rule) return { title: '湯液針法 處方', method: `${mapping.element} ${stateLabel}`, ...rule };
                } else if (system === 'yuanluo') {
                    const stateLabel = isUp ? '太過' : '不足';
                    const rule = YUANLUO_RULES[gender][mapping.element][stateLabel];
                    if(rule) return { title: '原絡針法 處方', method: `${mapping.element} ${stateLabel}`, ...rule };
                } else if (system === 'zhongshi') {
                    const agitatedSuffix = isUp ? '而躁' : '';
                    let targetTreatment = '';
                    const m = mapping.zs;
                    if (m === '脈口一盛') targetTreatment = `脈口一盛${agitatedSuffix}（補${isUp?'三焦瀉心包':'膽瀉肝'}）`;
                    if (m === '脈口二盛') targetTreatment = `脈口二盛${agitatedSuffix}（補${isUp?'小腸瀉心':'膀胱瀉腎'}）`;
                    if (m === '脈口三盛') targetTreatment = `脈口三盛${agitatedSuffix}（補${isUp?'大腸瀉肺':'胃瀉脾'}）`;
                    if (m === '人迎一盛') targetTreatment = `人迎一盛${agitatedSuffix}（補${isUp?'心包瀉三焦':'肝瀉膽'}）`;
                    if (m === '人迎二盛') targetTreatment = `人迎二盛${agitatedSuffix}（補${isUp?'心瀉小腸':'腎瀉膀胱'}）`;
                    if (m === '人迎三盛') targetTreatment = `人迎三盛${agitatedSuffix}（補${isUp?'肺瀉大腸':'脾瀉胃'}）`;
                    
                    const rule = ZHONGSHI_RULES[gender][targetTreatment];
                    if(rule) return { title: '終始針法 處方', method: targetTreatment, ...rule };
                }
                return null;
            }, [gender, system, swipeState]);

            const extraResult = useMemo(() => {
                if (system !== 'zhongshi') return null;
                return evaluateExtraordinaryMeridian(extraState.right, extraState.left, result);
            }, [system, extraState, result]);

            const Box = ({ id, labelRight, labelLeft }) => {
                const startPos = useRef({ x: 0, y: 0 });
                const [dragDir, setDragDir] = useState(null);
                const isSelected = swipeState.box === id;
                const isMenuOpen = activeMenu === id;
                const activeColor = gender === 'male' ? 'bg-blue-100 border-blue-400' : 'bg-pink-100 border-pink-400';

                const upLabel = system === 'zhongshi' ? '躁' : '太過';
                const downLabel = system === 'zhongshi' ? '不躁' : '不足';

                let text = '';
                if (dragDir) {
                    text = dragDir === 'up' ? upLabel : downLabel;
                } else if (isSelected) {
                    text = swipeState.dir === 'up' ? upLabel : downLabel;
                }

                return (
                    <div className="flex items-center justify-end gap-1.5 sm:gap-2 relative">
                        {labelLeft && <div className="w-4 sm:w-5 text-center text-xs sm:text-sm font-bold text-slate-400 select-none">{labelLeft}</div>}
                        <div className="relative">
                            <div 
                                className={`w-20 h-20 sm:w-28 sm:h-28 rounded-xl shadow-[3px_3px_8px_rgba(0,0,0,0.08)] border-2 flex items-center justify-center cursor-pointer swipe-box transition-colors duration-200 select-none ${isSelected || dragDir ? activeColor : 'bg-white border-white hover:border-slate-200'}`}
                                onPointerDown={(e) => {
                                    e.stopPropagation();
                                    startPos.current = { x: e.clientX, y: e.clientY };
                                    e.currentTarget.setPointerCapture(e.pointerId);
                                }}
                                onPointerMove={(e) => {
                                    if (!e.currentTarget.hasPointerCapture(e.pointerId)) return;
                                    const dy = e.clientY - startPos.current.y;
                                    if (dy < -18) setDragDir('up');
                                    else if (dy > 18) setDragDir('down');
                                    else setDragDir(null);
                                }}
                                onPointerUp={(e) => {
                                    e.stopPropagation();
                                    if (e.currentTarget.hasPointerCapture(e.pointerId)) {
                                        e.currentTarget.releasePointerCapture(e.pointerId);
                                    }
                                    const dx = e.clientX - startPos.current.x;
                                    const dy = e.clientY - startPos.current.y;
                                    setDragDir(null);
                                    if (Math.hypot(dx, dy) < 10) {
                                        setActiveMenu(prev => prev === id ? null : id);
                                    } else if (dy < -18) {
                                        setSwipeState({ box: id, dir: 'up' });
                                        setActiveMenu(null);
                                    } else if (dy > 18) {
                                        setSwipeState({ box: id, dir: 'down' });
                                        setActiveMenu(null);
                                    }
                                }}
                            >
                                {text && <span className="text-base sm:text-xl font-bold text-slate-600 pointer-events-none">{text}</span>}
                                {!text && <span className="text-[10px] sm:text-xs text-slate-300 opacity-70 pointer-events-none flex flex-col items-center gap-0.5"><span>↑{upLabel}</span><span>↓{downLabel}</span></span>}
                            </div>

                            {/* Radial Menu (Up / Down) */}
                            {isMenuOpen && (
                                <div className="absolute inset-0 z-30 pointer-events-none flex items-center justify-center">
                                    <button
                                        type="button"
                                        onClick={(e) => { e.stopPropagation(); setSwipeState({ box: id, dir: 'up' }); setActiveMenu(null); }}
                                        className="pointer-events-auto absolute -top-10 sm:-top-12 px-3 py-1.5 rounded-full bg-indigo-600 text-white text-xs sm:text-sm font-bold shadow-lg border-2 border-white hover:bg-indigo-700 whitespace-nowrap animate-in zoom-in-75 duration-150"
                                    >
                                        ↑ {upLabel}
                                    </button>
                                    <button
                                        type="button"
                                        onClick={(e) => { e.stopPropagation(); setSwipeState({ box: id, dir: 'down' }); setActiveMenu(null); }}
                                        className="pointer-events-auto absolute -bottom-10 sm:-bottom-12 px-3 py-1.5 rounded-full bg-indigo-600 text-white text-xs sm:text-sm font-bold shadow-lg border-2 border-white hover:bg-indigo-700 whitespace-nowrap animate-in zoom-in-75 duration-150"
                                    >
                                        ↓ {downLabel}
                                    </button>
                                </div>
                            )}
                        </div>
                        {labelRight && <div className="w-4 sm:w-5 text-center text-xs sm:text-sm font-bold text-slate-400 select-none">{labelRight}</div>}
                    </div>
                );
            };

            const OctagonBox = ({ handKey, labelLeft, labelRight }) => {
                const menuId = `${handKey}-oct`;
                const startPos = useRef({ x: 0, y: 0 });
                const [dragDir, setDragDir] = useState(null);
                const selectedDir = extraState[handKey];
                const isMenuOpen = activeMenu === menuId;
                const isSelected = Boolean(selectedDir);

                const fillColor = (isSelected || dragDir)
                    ? (gender === 'male' ? '#dbeafe' : '#fce7f3')
                    : '#ffffff';
                const strokeColor = (isSelected || dragDir)
                    ? (gender === 'male' ? '#60a5fa' : '#f472b6')
                    : '#e2e8f0';

                const displayCode = selectedDir ? EIGHT_EXTRA_DIRECTIONS[selectedDir].code : '';
                const dragLabel = dragDir ? EIGHT_EXTRA_DIRECTIONS[dragDir].label : '';

                const radius = 58; // px for mobile radial menu

                return (
                    <div className="flex items-center justify-end gap-1.5 sm:gap-2 relative">
                        {labelLeft && <div className="w-4 sm:w-5 text-center text-xs sm:text-sm font-bold text-slate-400 select-none">{labelLeft}</div>}
                        <div className="relative">
                            {/* Floating full description while swiping */}
                            {dragLabel && (
                                <div className="absolute -top-9 left-1/2 -translate-x-1/2 z-40 px-2.5 py-1 rounded-full bg-slate-800 text-white text-xs font-bold whitespace-nowrap shadow-md pointer-events-none">
                                    {dragLabel}
                                </div>
                            )}

                            <div
                                className="w-20 h-20 sm:w-28 sm:h-28 relative flex items-center justify-center cursor-pointer swipe-box select-none"
                                onPointerDown={(e) => {
                                    e.stopPropagation();
                                    startPos.current = { x: e.clientX, y: e.clientY };
                                    e.currentTarget.setPointerCapture(e.pointerId);
                                }}
                                onPointerMove={(e) => {
                                    if (!e.currentTarget.hasPointerCapture(e.pointerId)) return;
                                    const dx = e.clientX - startPos.current.x;
                                    const dy = e.clientY - startPos.current.y;
                                    if (Math.hypot(dx, dy) > 16) {
                                        setDragDir(getOctagonDirectionFromDelta(dx, dy));
                                    } else {
                                        setDragDir(null);
                                    }
                                }}
                                onPointerUp={(e) => {
                                    e.stopPropagation();
                                    if (e.currentTarget.hasPointerCapture(e.pointerId)) {
                                        e.currentTarget.releasePointerCapture(e.pointerId);
                                    }
                                    const dx = e.clientX - startPos.current.x;
                                    const dy = e.clientY - startPos.current.y;
                                    const dist = Math.hypot(dx, dy);
                                    setDragDir(null);
                                    if (dist < 10) {
                                        setActiveMenu(prev => prev === menuId ? null : menuId);
                                    } else if (dist >= 16) {
                                        const dir = getOctagonDirectionFromDelta(dx, dy);
                                        setExtraState(prev => ({ ...prev, [handKey]: dir }));
                                        setActiveMenu(null);
                                    }
                                }}
                            >
                                <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-[2px_3px_6px_rgba(0,0,0,0.08)] pointer-events-none">
                                    <polygon
                                        points="30,3 70,3 97,30 97,70 70,97 30,97 3,70 3,30"
                                        fill={fillColor}
                                        stroke={strokeColor}
                                        strokeWidth="3.5"
                                    />
                                </svg>
                                <span className={`absolute inset-0 flex items-center justify-center font-bold pointer-events-none px-1 text-center leading-tight ${isSelected ? 'text-sm sm:text-base text-slate-700' : 'text-xl sm:text-2xl text-slate-400'}`}>
                                    {dragDir ? EIGHT_EXTRA_DIRECTIONS[dragDir].code : (displayCode || '?')}
                                </span>
                            </div>

                            {/* 8-way Radial Menu */}
                            {isMenuOpen && (
                                <div className="absolute inset-0 z-40 flex items-center justify-center pointer-events-none">
                                    {Object.values(EIGHT_EXTRA_DIRECTIONS).map((item) => {
                                        const rad = (item.angle * Math.PI) / 180;
                                        const tx = Math.cos(rad) * radius;
                                        const ty = Math.sin(rad) * radius;
                                        const isActive = selectedDir === item.dir;
                                        return (
                                            <button
                                                key={item.dir}
                                                type="button"
                                                onClick={(e) => {
                                                    e.stopPropagation();
                                                    setExtraState(prev => ({ ...prev, [handKey]: item.dir }));
                                                    setActiveMenu(null);
                                                }}
                                                style={{ transform: `translate(${tx}px, ${ty}px)` }}
                                                className={`pointer-events-auto absolute px-2 py-1 rounded-full text-[11px] sm:text-xs font-bold shadow-lg border whitespace-nowrap transition-transform animate-in zoom-in-75 duration-150 ${isActive ? 'bg-amber-500 text-white border-white' : 'bg-indigo-600 text-white border-white hover:bg-indigo-700'}`}
                                            >
                                                {item.code}
                                            </button>
                                        );
                                    })}
                                    {isSelected && (
                                        <button
                                            type="button"
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setExtraState(prev => ({ ...prev, [handKey]: null }));
                                                setActiveMenu(null);
                                            }}
                                            className="pointer-events-auto w-8 h-8 rounded-full bg-slate-700 text-white text-xs font-bold shadow-md border-2 border-white flex items-center justify-center hover:bg-slate-800"
                                            title="清除"
                                        >
                                            ✕
                                        </button>
                                    )}
                                </div>
                            )}
                        </div>
                        {labelRight && <div className="w-4 sm:w-5 text-center text-xs sm:text-sm font-bold text-slate-400 select-none">{labelRight}</div>}
                    </div>
                );
            };

            return (
                <div className="space-y-3 sm:space-y-5 pb-20" onClick={() => activeMenu && setActiveMenu(null)}>
                    <header className="bg-white p-3.5 sm:p-5 rounded-xl shadow-sm border-l-4 border-indigo-500">
                        <h1 className="text-xl sm:text-2xl font-bold flex items-center gap-2 text-indigo-900">
                            快速按鈕輔助
                        </h1>
                        <p className="text-slate-500 mt-1 text-xs sm:text-sm">點擊中央彈出選單或直接滑動脈位生成處方</p>
                        <p className="text-indigo-600 text-xs sm:text-sm font-medium mt-0.5">※ 脈法判讀為蕭醫師的脈法</p>
                    </header>

                    {/* Gender Toggle */}
                    <div className="bg-white rounded-xl shadow-sm p-1.5 flex relative overflow-hidden border border-slate-200">
                        <div className={`absolute top-0 bottom-0 w-1/2 transition-transform duration-300 ease-in-out ${gender === 'male' ? 'bg-blue-100 translate-x-0' : 'bg-pink-100 translate-x-full'}`}></div>
                        <button onClick={() => { setSwipeState({box:null, dir:null}); setExtraState({right:null, left:null}); setActiveMenu(null); setGender('male'); }} className={`flex-1 py-2 sm:py-2.5 font-bold z-10 transition-colors text-sm sm:text-base ${gender === 'male' ? 'text-blue-800' : 'text-slate-400'}`}>男性</button>
                        <button onClick={() => { setSwipeState({box:null, dir:null}); setExtraState({right:null, left:null}); setActiveMenu(null); setGender('female'); }} className={`flex-1 py-2 sm:py-2.5 font-bold z-10 transition-colors text-sm sm:text-base ${gender === 'female' ? 'text-pink-800' : 'text-slate-400'}`}>女性</button>
                    </div>

                    {/* System Toggle */}
                    <div className="grid grid-cols-3 gap-2">
                        <button onClick={() => { setSwipeState({box:null, dir:null}); setExtraState({right:null, left:null}); setActiveMenu(null); setSystem('tangye'); }} className={`py-2 sm:py-2.5 rounded-lg font-bold border transition-all text-sm sm:text-base ${system === 'tangye' ? 'bg-teal-100 text-teal-800 border-teal-300' : 'bg-white text-slate-400 border-slate-200'}`}>湯液</button>
                        <button onClick={() => { setSwipeState({box:null, dir:null}); setExtraState({right:null, left:null}); setActiveMenu(null); setSystem('zhongshi'); }} className={`py-2 sm:py-2.5 rounded-lg font-bold border transition-all text-sm sm:text-base ${system === 'zhongshi' ? 'bg-orange-100 text-orange-800 border-orange-300' : 'bg-white text-slate-400 border-slate-200'}`}>終始</button>
                        <button onClick={() => { setSwipeState({box:null, dir:null}); setExtraState({right:null, left:null}); setActiveMenu(null); setSystem('yuanluo'); }} className={`py-2 sm:py-2.5 rounded-lg font-bold border transition-all text-sm sm:text-base ${system === 'yuanluo' ? 'bg-blue-100 text-blue-800 border-blue-300' : 'bg-white text-slate-400 border-slate-200'}`}>原絡</button>
                    </div>

                    {/* Grid (Center blank space remains scrollable) */}
                    <div className="bg-slate-100 rounded-xl p-3 py-4 sm:p-6 sm:py-6">
                        <div className="max-w-md mx-auto relative flex justify-center gap-8 sm:gap-12">
                            {/* Left Column (Right Hand) */}
                            <div className="flex flex-col gap-2.5 sm:gap-4 items-end">
                                <Box id="right-chi" labelRight="" labelLeft="尺" />
                                <Box id="right-guan" labelRight="" labelLeft="關" />
                                <Box id="right-chun" labelRight="" labelLeft="寸" />
                                {system === 'zhongshi' && (
                                    <OctagonBox handKey="right" labelRight="" labelLeft="奇" />
                                )}
                                <div className="text-center font-bold text-slate-500 mt-0.5 text-sm sm:text-base w-20 sm:w-28">右手</div>
                            </div>
                            {/* Right Column (Left Hand) */}
                            <div className="flex flex-col gap-2.5 sm:gap-4 items-start">
                                <Box id="left-chi" labelRight="尺" labelLeft="" />
                                <Box id="left-guan" labelRight="關" labelLeft="" />
                                <Box id="left-chun" labelRight="寸" labelLeft="" />
                                {system === 'zhongshi' && (
                                    <OctagonBox handKey="left" labelRight="奇" labelLeft="" />
                                )}
                                <div className="text-center font-bold text-slate-500 mt-0.5 text-sm sm:text-base w-20 sm:w-28">左手</div>
                            </div>
                        </div>
                    </div>

                    <ResultCard result={result} gender={gender} systemType={system} extraResult={extraResult} />
                </div>
            );
        };

        // --- 私人筆記：安全 AST 轉 React 節點（不使用 dangerouslySetInnerHTML）---
        const renderNoteAstToReact = (nodes, prefix = 'n') => {
            if (!Array.isArray(nodes)) return null;
            return nodes.map((node, idx) => {
                const key = `${prefix}-${idx}`;
                if (node.type === 'text') {
                    return node.value;
                }
                if (node.type === 'br') {
                    return <br key={key} />;
                }
                if (node.type === 'strong') {
                    return <strong key={key} className="font-bold text-slate-900">{renderNoteAstToReact(node.children, key)}</strong>;
                }
                if (node.type === 'u') {
                    return <u key={key} className="underline decoration-indigo-500 decoration-2 underline-offset-2">{renderNoteAstToReact(node.children, key)}</u>;
                }
                return null;
            });
        };

        const formatNoteTimestamp = (isoStr) => {
            if (!isoStr) return '';
            const d = new Date(isoStr);
            if (Number.isNaN(d.getTime())) return isoStr;
            try {
                return d.toLocaleString('zh-TW', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });
            } catch (e) {
                return d.toISOString().slice(0, 16).replace('T', ' ');
            }
        };

        const PrivateNotesView = () => {
            const notesApi = window.AcuPrivateNotes;
            const notesRepo = useMemo(() => notesApi ? notesApi.createLocalNotesRepository() : null, [notesApi]);

            const [notes, setNotes] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [corrupted, setCorrupted] = useState(false);
            const [loadError, setLoadError] = useState(null);

            const [editingId, setEditingId] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [saveStatus, setSaveStatus] = useState(null); // 'saved' | 'error' | null
            const [saveMessage, setSaveMessage] = useState('');

            const [deleteTarget, setDeleteTarget] = useState(null);
            const [isDeleting, setIsDeleting] = useState(false);
            const [resetConfirmOpen, setResetConfirmOpen] = useState(false);
            const [isResetting, setIsResetting] = useState(false);

            const editorRef = useRef(null);
            const isSavingRef = useRef(false);

            const loadNotes = async () => {
                if (!notesRepo) {
                    setIsLoading(false);
                    setLoadError('私人筆記模組未正確載入，請重新整理頁面。');
                    return;
                }
                setIsLoading(true);
                setLoadError(null);
                try {
                    const res = await notesRepo.list();
                    if (res && res.ok) {
                        setNotes(Array.isArray(res.notes) ? res.notes : []);
                        setCorrupted(false);
                        setLoadError(null);
                    } else if (res && res.error && res.error.code === notesApi.ERROR_CODES.CORRUPT_DATA) {
                        setNotes([]);
                        setCorrupted(true);
                        setLoadError(res.error.message || '本機筆記資料格式受損，無法讀取。');
                    } else {
                        setNotes([]);
                        setCorrupted(false);
                        setLoadError(res && res.error && res.error.message ? res.error.message : '載入筆記失敗，請稍後重試。');
                    }
                } catch (_err) {
                    setNotes([]);
                    setCorrupted(false);
                    setLoadError('載入筆記時發生非預期錯誤，請重新整理頁面或稍後重試。');
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                loadNotes();
            }, [notesRepo]);

            const clearEditor = () => {
                if (editorRef.current && notesApi) {
                    notesApi.renderAstIntoDom(editorRef.current, '', document);
                }
                setEditingId(null);
            };

            const applyFormat = (command) => {
                if (corrupted || isSaving) return;
                if (editorRef.current) {
                    editorRef.current.focus();
                }
                try {
                    document.execCommand(command, false, null);
                } catch (e) {
                    // Fallback ignored if browser does not support execCommand
                }
                if (saveStatus === 'saved') {
                    setSaveStatus(null);
                    setSaveMessage('');
                }
            };

            const handlePaste = (e) => {
                e.preventDefault();
                if (corrupted || isSaving || !notesApi) return;

                try {
                    const clipboard = e.clipboardData || window.clipboardData;
                    const rawHtml = clipboard ? clipboard.getData('text/html') : '';
                    const rawPlain = clipboard ? clipboard.getData('text/plain') : '';
                    const sanitized = notesApi.sanitizeNoteHtml(rawHtml || rawPlain);

                    const frag = document.createDocumentFragment();
                    notesApi.renderAstIntoDom(frag, sanitized, document);

                    const sel = window.getSelection ? window.getSelection() : null;
                    if (sel && sel.rangeCount > 0) {
                        const range = sel.getRangeAt(0);
                        range.deleteContents();
                        const lastNode = frag.lastChild;
                        range.insertNode(frag);
                        if (lastNode) {
                            const newRange = document.createRange();
                            newRange.setStartAfter(lastNode);
                            newRange.collapse(true);
                            sel.removeAllRanges();
                            sel.addRange(newRange);
                        }
                    } else if (editorRef.current) {
                        editorRef.current.appendChild(frag);
                    }

                    if (saveStatus === 'saved') {
                        setSaveStatus(null);
                        setSaveMessage('');
                    }
                } catch (_err) {
                    setSaveStatus('error');
                    setSaveMessage('貼上內容時發生非預期錯誤，請改用手動輸入或稍後重試。');
                }
            };

            const handleEditorInput = () => {
                if (saveStatus === 'saved') {
                    setSaveStatus(null);
                    setSaveMessage('');
                }
            };

            const handleSave = async () => {
                if (isSavingRef.current || corrupted || !notesRepo || !notesApi) return;
                isSavingRef.current = true;
                setIsSaving(true);
                setSaveStatus(null);
                setSaveMessage('');

                try {
                    const serialized = notesApi.serializeEditorElement(editorRef.current);
                    if (notesApi.isNoteContentEmpty(serialized)) {
                        setSaveStatus('error');
                        setSaveMessage('筆記內容不可為空白，請輸入文字後再儲存。');
                        return;
                    }

                    const wasEditing = Boolean(editingId);
                    const res = wasEditing
                        ? await notesRepo.update(editingId, { content: serialized })
                        : await notesRepo.create({ content: serialized });

                    if (res && res.ok) {
                        setNotes(Array.isArray(res.notes) ? res.notes : []);
                        clearEditor();
                        setSaveStatus('saved');
                        setSaveMessage(wasEditing ? '已儲存筆記變更' : '已儲存新筆記');
                    } else {
                        if (res && res.error && res.error.code === notesApi.ERROR_CODES.CORRUPT_DATA) {
                            setCorrupted(true);
                            setLoadError(res.error.message || '本機筆記資料格式受損，無法讀取。');
                        }
                        // 寫入失敗時保留編輯器內容，絕不顯示已儲存
                        setSaveStatus('error');
                        setSaveMessage(res && res.error && res.error.message ? res.error.message : '儲存失敗，您的編輯內容已保留。');
                    }
                } catch (_err) {
                    // 非預期例外時保留編輯器內容、絕不顯示已儲存，且不暴露內部錯誤細節
                    setSaveStatus('error');
                    setSaveMessage('儲存筆記時發生非預期錯誤，您的編輯內容已保留，請稍後重試。');
                } finally {
                    isSavingRef.current = false;
                    setIsSaving(false);
                }
            };

            const handleStartEdit = (note) => {
                if (corrupted || isSaving || !notesApi) return;
                setEditingId(note.id);
                setSaveStatus(null);
                setSaveMessage('');
                if (editorRef.current) {
                    notesApi.renderAstIntoDom(editorRef.current, note.content, document);
                    editorRef.current.focus();
                    editorRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            const handleCancelEdit = () => {
                clearEditor();
                setSaveStatus(null);
                setSaveMessage('');
            };

            const handleConfirmDelete = async () => {
                if (!deleteTarget || isDeleting || !notesRepo || !notesApi) return;
                setIsDeleting(true);
                try {
                    const res = await notesRepo.delete(deleteTarget.id);
                    if (res && res.ok) {
                        setNotes(Array.isArray(res.notes) ? res.notes : []);
                        if (editingId === deleteTarget.id) {
                            clearEditor();
                        }
                        setDeleteTarget(null);
                    } else {
                        if (res && res.error && res.error.code === notesApi.ERROR_CODES.CORRUPT_DATA) {
                            setCorrupted(true);
                            setLoadError(res.error.message || '本機筆記資料格式受損，無法讀取。');
                        }
                        setSaveStatus('error');
                        setSaveMessage(res && res.error && res.error.message ? res.error.message : '刪除失敗，請稍後再試。');
                        setDeleteTarget(null);
                    }
                } catch (_err) {
                    setSaveStatus('error');
                    setSaveMessage('刪除筆記時發生非預期錯誤，請稍後重試。');
                    setDeleteTarget(null);
                } finally {
                    setIsDeleting(false);
                }
            };

            const handleConfirmResetCorrupted = async () => {
                if (isResetting || !notesRepo) return;
                setIsResetting(true);
                try {
                    const res = await notesRepo.resetCorruptedData({ confirmed: true });
                    if (res && res.ok) {
                        setCorrupted(false);
                        setLoadError(null);
                        setNotes([]);
                        clearEditor();
                        setResetConfirmOpen(false);
                        setSaveStatus(null);
                        setSaveMessage('');
                    } else {
                        setSaveStatus('error');
                        setSaveMessage(res && res.error && res.error.message ? res.error.message : '重設受損資料失敗。');
                        setResetConfirmOpen(false);
                    }
                } catch (_err) {
                    setSaveStatus('error');
                    setSaveMessage('重設受損資料時發生非預期錯誤，請稍後重試。');
                    setResetConfirmOpen(false);
                } finally {
                    setIsResetting(false);
                }
            };

            return (
                <div className="space-y-4 sm:space-y-6 pb-20">
                    {/* 標題區 */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
                        <div className="flex items-center gap-3">
                            <div className="p-2.5 bg-indigo-100 text-indigo-700 rounded-xl">
                                <Icons.FileText className="w-6 h-6" />
                            </div>
                            <div>
                                <h2 className="text-xl sm:text-2xl font-bold text-slate-900">私人筆記</h2>
                                <p className="text-xs sm:text-sm text-slate-500 mt-0.5">臨床學習與輔助想法紀錄（僅存於本機瀏覽器）</p>
                            </div>
                        </div>
                    </div>

                    {/* 本機保存與隱私提醒 */}
                    <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 sm:p-5 text-amber-950 shadow-sm" role="note" aria-label="本機私人筆記提醒">
                        <div className="flex items-start gap-3">
                            <Icons.AlertTriangle className="w-5 h-5 text-amber-600 shrink-0 mt-0.5" />
                            <div className="space-y-1.5 text-sm leading-relaxed">
                                <div className="font-bold text-amber-900">重要提醒：本機儲存與隱私須知</div>
                                <ul className="list-disc pl-5 space-y-1 text-amber-900/90">
                                    <li>筆記<strong>只保存在這台裝置的目前瀏覽器</strong>，不會分享、上傳或同步至雲端。</li>
                                    <li><strong>清除網站資料、改用其他裝置或瀏覽器</strong>，可能造成筆記遺失。</li>
                                    <li><strong>請勿記錄可識別病人的個人資料</strong>（如姓名、病歷號、電話、身分證字號等）；本機儲存<strong>不是加密保險箱</strong>。</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    {/* 資料受損警示區（保留原始資料，不可自動清空或覆寫） */}
                    {corrupted && (
                        <div className="bg-red-50 border-2 border-red-300 rounded-2xl p-4 sm:p-5 text-red-900 shadow-sm space-y-3" role="alert">
                            <div className="flex items-start gap-3">
                                <Icons.AlertTriangle className="w-5 h-5 text-red-600 shrink-0 mt-0.5" />
                                <div className="space-y-1 text-sm">
                                    <div className="font-bold text-red-900">偵測到本機筆記資料受損</div>
                                    <p>{loadError || '無法解析本機筆記資料。'}</p>
                                    <p className="text-xs text-red-800">
                                        為避免原始資料被悄悄覆寫而遺失，系統目前<strong>已保留原始資料</strong>並暫停新增、編輯與儲存功能。若確定不再需要受損資料，可點擊下方按鈕並經二次確認後重設。
                                    </p>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2 pt-1">
                                <button
                                    type="button"
                                    onClick={() => setResetConfirmOpen(true)}
                                    className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-xl transition-colors"
                                >
                                    重設受損資料
                                </button>
                                <button
                                    type="button"
                                    onClick={loadNotes}
                                    className="px-4 py-2 bg-white border border-red-300 text-red-700 hover:bg-red-100 text-sm font-bold rounded-xl transition-colors"
                                >
                                    重新檢查
                                </button>
                            </div>
                        </div>
                    )}

                    {/* 編輯器卡片 */}
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 space-y-3">
                        <div className="flex items-center justify-between gap-2">
                            <h3 className="font-bold text-slate-800 text-base sm:text-lg">
                                {editingId ? '編輯筆記' : '新增筆記'}
                            </h3>
                            {editingId && (
                                <button
                                    type="button"
                                    onClick={handleCancelEdit}
                                    className="text-xs sm:text-sm px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold transition-colors"
                                >
                                    取消編輯
                                </button>
                            )}
                        </div>

                        {/* 格式工具列 */}
                        <div className="flex items-center justify-between flex-wrap gap-2 pb-2 border-b border-slate-100">
                            <div className="flex items-center gap-2">
                                <button
                                    type="button"
                                    disabled={corrupted || isSaving}
                                    onMouseDown={(e) => e.preventDefault()}
                                    onClick={() => applyFormat('bold')}
                                    className="px-3.5 py-1.5 rounded-lg border border-slate-300 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-800 font-extrabold text-sm disabled:opacity-40 transition-colors"
                                    title="粗體"
                                    aria-label="粗體"
                                >
                                    B 粗體
                                </button>
                                <button
                                    type="button"
                                    disabled={corrupted || isSaving}
                                    onMouseDown={(e) => e.preventDefault()}
                                    onClick={() => applyFormat('underline')}
                                    className="px-3.5 py-1.5 rounded-lg border border-slate-300 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-800 underline font-bold text-sm disabled:opacity-40 transition-colors"
                                    title="底線"
                                    aria-label="底線"
                                >
                                    U 底線
                                </button>
                            </div>
                            <span className="text-xs text-slate-400">僅支援粗體、底線與換行</span>
                        </div>

                        {/* 編輯輸入區 */}
                        <div
                            ref={editorRef}
                            contentEditable={!corrupted && !isSaving}
                            suppressContentEditableWarning={true}
                            role="textbox"
                            aria-multiline="true"
                            aria-label="私人筆記內容"
                            data-placeholder={corrupted ? '目前資料受損，已暫停編輯以保護原始資料...' : '在此輸入臨床學習筆記或觀察想法（請勿輸入病人個資）...'}
                            onPaste={handlePaste}
                            onInput={handleEditorInput}
                            className={`note-editor min-h-[140px] max-h-[360px] overflow-y-auto w-full rounded-xl border p-3.5 text-base leading-relaxed focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-colors break-words ${
                                corrupted ? 'bg-slate-100 border-slate-200 text-slate-400 cursor-not-allowed' : 'bg-white border-slate-300 text-slate-800'
                            }`}
                        ></div>

                        {/* 操作列與狀態顯示 */}
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pt-1">
                            <button
                                type="button"
                                disabled={corrupted || isSaving}
                                onClick={handleSave}
                                className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold shadow-sm disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
                            >
                                {isSaving ? '儲存中...' : (editingId ? '更新筆記' : '儲存筆記')}
                            </button>

                            {saveStatus === 'saved' && (
